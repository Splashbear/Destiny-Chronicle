<div class="space-y-6">
  <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
    <h3 class="text-lg font-semibold text-white">Titles (Cross-Save Account)</h3>
    <div class="flex items-center gap-3">
      <button (click)="ps.refreshTitles()"
              [disabled]="ps.loadingTitlesOverall"
              class="px-3 py-1.5 destiny-btn-primary disabled:opacity-50 disabled:cursor-not-allowed text-sm flex items-center gap-2">
        <app-destiny-loader *ngIf="ps.loadingTitlesOverall" size="sm"></app-destiny-loader>
        {{ ps.loadingTitlesOverall ? 'Refreshing...' : 'Refresh Titles' }}
      </button>
      <button (click)="ps.debugTitles()"
              class="px-3 py-1.5 destiny-btn-secondary text-sm">
        Debug Titles
      </button>
    </div>
  </div>

  <div *ngIf="ps.loadingTitlesOverall" class="flex flex-col items-center justify-center py-12 w-full">
    <app-destiny-loader size="lg" label="Loading titles…"></app-destiny-loader>
    <div class="text-sm text-slate-400 mt-2">Fetching title data from Bungie</div>
  </div>

  <div *ngIf="!ps.loadingTitlesOverall && ps.aggregatedTitles.length === 0" class="flex flex-col items-center justify-center py-12 w-full">
    <div class="text-lg text-slate-400 font-medium mb-2">No titles found</div>
    <div class="text-sm text-slate-500 text-center">
      No Destiny 2 titles are available for the selected accounts.<br>
      Make sure you have Destiny 2 accounts selected and try refreshing.
    </div>
  </div>

  <app-seal-poster-studio
    *ngIf="!ps.loadingTitlesOverall && ps.aggregatedTitles.length > 0"
    [titles]="ps.aggregatedTitles"
    [membershipId]="ps.getMainMembershipId()">
  </app-seal-poster-studio>
</div>
