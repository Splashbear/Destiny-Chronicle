<div class="min-h-screen destiny-bg-gradient-dark">
  <!-- Modern header with glass effect -->
  <header class="glass-effect border-b border-destiny-border-primary/30">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <!-- Logo area with Destiny styling -->
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-destiny-gradient rounded-destiny flex items-center justify-center">
              <div class="w-6 h-6 bg-destiny-accent-primary rounded-full animate-glow"></div>
            </div>
            <div>
              <h1 class="text-3xl font-bold font-d2-headline text-gradient">{{ title }}</h1>
              <p class="text-sm text-destiny-text-secondary">Track your Destiny 1 & 2 activity history</p>
            </div>
          </div>
        </div>
        
        <!-- Header actions area -->
        <div class="flex items-center space-x-3">
          <!-- Theme indicator -->
          <div class="flex items-center space-x-2 px-3 py-1.5 rounded-full transition-all duration-300"
               [ngClass]="isDarkMode ? 'bg-slate-800/50 text-slate-300' : 'bg-blue-100/50 text-blue-700'">
            <span class="text-xs font-medium">{{ isDarkMode ? 'Dark' : 'Light' }}</span>
            <div class="w-2 h-2 rounded-full transition-all duration-300"
                 [ngClass]="isDarkMode ? 'bg-slate-400' : 'bg-blue-500'"></div>
          </div>
          
          <!-- Functional Theme toggle -->
          <button (click)="toggleTheme()" 
                  class="destiny-btn-ghost p-2 relative group transition-all duration-300 hover:scale-110"
                  [title]="'Switch to ' + (isDarkMode ? 'light' : 'dark') + ' mode'"
                  [attr.aria-label]="'Switch to ' + (isDarkMode ? 'light' : 'dark') + ' mode'">
            <!-- Theme indicator background -->
            <div class="absolute inset-0 rounded-lg transition-all duration-300"
                 [ngClass]="isDarkMode ? 'bg-slate-800/50' : 'bg-blue-100/50'"></div>
            
            <!-- Icons with smooth transitions -->
            <svg *ngIf="isDarkMode" class="w-5 h-5 relative z-10 text-yellow-400 transition-all duration-300" 
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m6.01-6.01l.707.707m12.02 12.02l.707.707m-6.01-6.01L12 12m0 0l-6.01 6.01m6.01-6.01L12 12"></path>
            </svg>
            <svg *ngIf="!isDarkMode" class="w-5 h-5 relative z-10 text-blue-600 transition-all duration-300" 
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 006.354-5.646z"></path>
            </svg>
            
            <!-- Theme label on hover -->
            <span class="absolute -bottom-8 left-1/2 transform -translate-x-1/2 px-2 py-1 text-xs text-white bg-slate-800 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap z-20">
              {{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}
            </span>
          </button>
          
          <!-- Settings placeholder -->
          <button class="destiny-btn-ghost p-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main content area with enhanced spacing -->
  <main class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
    <!-- Background decoration -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-40 -right-40 w-80 h-80 bg-destiny-accent-primary/5 rounded-full blur-3xl"></div>
      <div class="absolute top-40 -left-40 w-96 h-96 bg-destiny-accent-secondary/5 rounded-full blur-3xl"></div>
    </div>
    
    <!-- Browser compatibility warning -->
    <app-browser-compatibility-warning></app-browser-compatibility-warning>
    
    <!-- Main component with enhanced container -->
    <div class="relative">
      <app-player-search></app-player-search>
    </div>
  </main>

  <!-- Performance monitor (if enabled) -->
  <app-performance-monitor></app-performance-monitor>
</div>
