<div class="min-h-screen destiny-bg-gradient-dark">
  <!-- Modern header with glass effect -->
  <header class="glass-effect border-b border-destiny-border-primary/30">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <!-- Theme toggle -->
          <button (click)="theme.toggle()"
                  class="p-2 rounded-lg bg-slate-700/50 hover:bg-slate-600/70 text-slate-300 hover:text-white transition-colors"
                  [attr.aria-label]="theme.isLight ? 'Switch to dark mode' : 'Switch to light mode'"
                  [title]="theme.isLight ? 'Dark mode' : 'Light mode'">
            <svg *ngIf="!theme.isLight" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg *ngIf="theme.isLight" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>
          <!-- Logo area with Destiny styling -->
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-destiny-gradient rounded-destiny flex items-center justify-center">
              <div class="w-6 h-6 bg-destiny-accent-primary rounded-full animate-glow"></div>
            </div>
            <div>
              <h1 class="text-3xl font-bold font-d2-headline text-gradient">{{ title }}</h1>
              <p class="text-sm text-destiny-text-secondary">Track your Destiny 1 & 2 activity history</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main content area with enhanced spacing -->
  <main class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
    <!-- Background decoration -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-40 -right-40 w-80 h-80 bg-destiny-accent-primary/5 rounded-full blur-3xl"></div>
      <div class="absolute top-40 -left-40 w-96 h-96 bg-destiny-accent-secondary/5 rounded-full blur-3xl"></div>
    </div>
    
    <!-- Browser compatibility warning -->
    <app-browser-compatibility-warning></app-browser-compatibility-warning>
    
    <!-- Main component with enhanced container -->
    <div class="relative">
      <app-player-search></app-player-search>
    </div>
  </main>

  <!-- Performance monitor (if enabled) -->
  <app-performance-monitor></app-performance-monitor>
</div>
