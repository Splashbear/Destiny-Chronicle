name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

# Rapid merges used to race on gh-pages (non-fast-forward push reject, or
# an older deploy finishing after a newer one). One deploy at a time; cancel
# superseded runs so the newest master tip wins.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npx ng build --configuration production --base-href / --deploy-url /

      - name: Copy index.html to 404.html
        run: cp dist/destiny-chronicle/browser/index.html dist/destiny-chronicle/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/destiny-chronicle/browser
          cname: destinychronicle.com
          # Avoid non-fast-forward rejects when another deploy pushed mid-run.
          force_orphan: true
